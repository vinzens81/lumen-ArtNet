# Test settings: tests run in the module directory lumen-app/
spring:
  main:
    banner-mode: off
lumen:
  fixture-library-dir: ../fixture-types
  # separate database per Spring context, removed by 'mvn clean'
  database-file: target/test-data/${random.uuid}.db
  artnet:
    # never send packets into the network from tests
    enabled: false
  sacn:
    enabled: false
  backup:
    dir: target/test-data/backups/${random.uuid}
