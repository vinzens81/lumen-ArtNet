spring:
  application:
    name: lumen
  web:
    resources:
      cache:
        cachecontrol:
          # index.html must be revalidated, hashed files under /assets are cached (StaticResourcesConfiguration)
          no-cache: true

server:
  # Only reachable locally by default; network access will be enabled via a setting later
  address: 127.0.0.1
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

lumen:
  # Fixture library (YAML), relative to the working directory
  fixture-library-dir: fixture-types
  # Project data (SQLite), created on first start
  database-file: data/lumen.db
  backup:
    # copies of the database, created on start, when show mode starts and when another project is activated
    dir: data/backups
    # older backups are deleted
    keep: 30
  output:
    # render loop rate (Art-Net allows at most 44 frames per second)
    rate-hz: 40
  artnet:
    enabled: true
    # local address to send from, 0.0.0.0 = any interface
    bind-address: 0.0.0.0
    # destination UDP port (Art-Net standard: 6454)
    port: 6454
    # destination for broadcast universes and ArtPoll, e.g. 2.255.255.255 or the directed broadcast of your network
    broadcast-address: 255.255.255.255
    # nodes answer ArtPoll on this port (Art-Net standard: 6454)
    listen-port: 6454
    # how often nodes are discovered
    poll-interval: 3s
