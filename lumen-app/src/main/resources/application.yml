spring:
  application:
    name: lumen

server:
  # Standardmäßig nur lokal erreichbar; Netzwerkzugriff wird später per Einstellung freigeschaltet
  address: 127.0.0.1
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

lumen:
  # Gerätebibliothek (YAML), relativ zum Arbeitsverzeichnis
  fixture-library-dir: fixture-types
