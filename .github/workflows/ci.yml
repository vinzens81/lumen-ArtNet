name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - name: Build with all tests
        run: ./mvnw -B verify

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: lumen-jar
          path: lumen-app/target/lumen-app-*.jar
          retention-days: 7
          if-no-files-found: error
