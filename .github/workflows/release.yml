name: Release

# Builds the installers for the three platforms: DMG (macOS), MSI (Windows) and deb + portable archive (Linux).
# Runs on every version tag (v1.2.0 → version 1.2.0) and manually via workflow_dispatch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version of the installers (e.g. 1.2.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - name: Normalize version
        id: version
        run: echo "value=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Build JAR (tests run in CI on every commit)
        run: ./mvnw -B clean package -DskipTests

      - name: Package DMG
        run: |
          work=target/macos
          mkdir -p "$work/input" dist
          jar=$(ls lumen-app/target/lumen-app-*.jar | grep -v '\.original$' | head -n 1)
          cp "$jar" "$work/input/lumen-app.jar"
          cp -R fixture-types "$work/input/fixture-types"

          iconset="$work/Lumen.iconset"
          mkdir -p "$iconset"
          java packaging/macos/MakeIcon.java "$work/icon.png"
          for size in 16 32 128 256 512; do
            sips -z $size $size "$work/icon.png" --out "$iconset/icon_${size}x${size}.png" >/dev/null
            sips -z $((size * 2)) $((size * 2)) "$work/icon.png" --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$work/Lumen.icns"

          jpackage \
            --type app-image \
            --name Lumen \
            --app-version "${{ steps.version.outputs.value }}" \
            --vendor "Lumen" \
            --description "DMX/Art-Net lighting control for the theatre" \
            --input "$work/input" \
            --main-jar lumen-app.jar \
            --java-options "-Dlumen.desktop=true" \
            --java-options '-Dlumen.bundled-fixture-library=$APPDIR/fixture-types' \
            --icon "$work/Lumen.icns" \
            --mac-package-identifier de.vinzens.lumen \
            --mac-package-name Lumen \
            --mac-app-category public.app-category.utilities \
            --dest "$work/image"

          # no App Nap: macOS would otherwise throttle the render loop in the background
          app="$work/image/Lumen.app"
          /usr/libexec/PlistBuddy -c "Add :NSAppSleepDisabled bool true" "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"

          jpackage \
            --type dmg \
            --app-image "$app" \
            --name Lumen \
            --app-version "${{ steps.version.outputs.value }}" \
            --vendor "Lumen" \
            --dest dist

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: lumen-macos-dmg
          path: dist/*.dmg
          retention-days: 30
          if-no-files-found: error

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*.dmg

  windows:
    name: Windows MSI
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - name: Normalize version
        id: version
        shell: bash
        run: echo "value=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Build JAR (tests run in CI on every commit)
        run: ./mvnw -B clean package -DskipTests

      - name: Package MSI
        shell: bash
        run: |
          work=target/windows
          mkdir -p "$work/input" dist
          jar=$(ls lumen-app/target/lumen-app-*.jar | grep -v '\.original$' | head -n 1)
          cp "$jar" "$work/input/lumen-app.jar"
          cp -R fixture-types "$work/input/fixture-types"

          java packaging/macos/MakeIcon.java "$work/icon.png"
          java packaging/windows/MakeIco.java "$work/icon.png" "$work/Lumen.ico"

          jpackage \
            --type msi \
            --name Lumen \
            --app-version "${{ steps.version.outputs.value }}" \
            --vendor "Lumen" \
            --description "DMX/Art-Net lighting control for the theatre" \
            --input "$work/input" \
            --main-jar lumen-app.jar \
            --java-options "-Dlumen.desktop=true" \
            --java-options '-Dlumen.bundled-fixture-library=$APPDIR/fixture-types' \
            --icon "$work/Lumen.ico" \
            --win-menu \
            --win-shortcut \
            --dest dist

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: lumen-windows-msi
          path: dist/*.msi
          retention-days: 30
          if-no-files-found: error

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*.msi

  linux:
    name: Linux deb + app-image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - name: Normalize version
        id: version
        run: |
          version="${VERSION#v}"
          echo "value=${version%%-*}" >> "$GITHUB_OUTPUT"

      - name: Build JAR (tests run in CI on every commit)
        run: ./mvnw -B clean package -DskipTests

      - name: Package deb and app-image
        run: |
          work=target/linux
          mkdir -p "$work/input" dist
          jar=$(ls lumen-app/target/lumen-app-*.jar | grep -v '\.original$' | head -n 1)
          cp "$jar" "$work/input/lumen-app.jar"
          cp -R fixture-types "$work/input/fixture-types"

          # an icon, so Lumen appears with its logo in the applications menu (jpackage writes the .desktop entry)
          java packaging/macos/MakeIcon.java "$work/lumen.png"

          jpackage \
            --type app-image \
            --name Lumen \
            --app-version "${{ steps.version.outputs.value }}" \
            --vendor "Lumen" \
            --description "DMX/Art-Net lighting control for the theatre" \
            --input "$work/input" \
            --main-jar lumen-app.jar \
            --java-options "-Dlumen.desktop=true" \
            --java-options '-Dlumen.bundled-fixture-library=$APPDIR/fixture-types' \
            --icon "$work/lumen.png" \
            --dest "$work/image"

          jpackage \
            --type deb \
            --app-image "$work/image/Lumen" \
            --name lumen \
            --app-version "${{ steps.version.outputs.value }}" \
            --vendor "Lumen" \
            --linux-menu-group Utility \
            --dest dist

          tar czf "dist/Lumen-${{ steps.version.outputs.value }}-linux.tar.gz" -C "$work/image" Lumen

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: lumen-linux
          path: |
            dist/*.deb
            dist/*.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.deb
            dist/*.tar.gz
