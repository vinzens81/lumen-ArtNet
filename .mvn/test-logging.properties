# java.util.logging for tests of the modules without Spring (see maven-surefire-plugin in pom.xml):
# passing tests stay quiet, warnings and errors are still shown.
handlers = java.util.logging.ConsoleHandler
.level = WARNING
java.util.logging.ConsoleHandler.level = ALL
java.util.logging.SimpleFormatter.format = %4$s %3$s: %5$s%6$s%n
