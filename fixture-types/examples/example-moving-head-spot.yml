# Beispielprofil für einen Moving Head – an das echte Gerät anpassen (Kanalbelegung laut Handbuch).
id: example-moving-head-spot
manufacturer: Example
model: Spot 60
category: moving-head

physical:
  pan-range: 540
  tilt-range: 270

modes:
  - name: 13ch
    channels:
      - function: pan
        resolution: 16
        default: 32768
      - function: tilt
        resolution: 16
        default: 32768
      - function: speed
        default: 0
      - function: dimmer
      - function: shutter
        default: 255
        ranges:
          - { from: 0,   to: 7,   label: Geschlossen }
          - { from: 8,   to: 15,  label: Offen }
          - { from: 16,  to: 255, label: Strobe langsam → schnell }
      - function: color-wheel
        ranges:
          - { from: 0,   to: 9,   label: Weiß,  color: "#ffffff" }
          - { from: 10,  to: 19,  label: Rot,   color: "#ff0000" }
          - { from: 20,  to: 29,  label: Blau,  color: "#0033ff" }
          - { from: 30,  to: 39,  label: Grün,  color: "#00ff44" }
          - { from: 40,  to: 49,  label: Gelb,  color: "#ffdd00" }
          - { from: 50,  to: 255, label: Farbrad-Rotation }
      - function: gobo
        ranges:
          - { from: 0,   to: 9,   label: Offen }
          - { from: 10,  to: 19,  label: Gobo 1 }
          - { from: 20,  to: 29,  label: Gobo 2 }
          - { from: 30,  to: 255, label: Gobo-Shake }
      - function: gobo-rotation
      - function: focus
      - function: prism
        ranges:
          - { from: 0,   to: 127, label: Aus }
          - { from: 128, to: 255, label: Prisma an }
      - function: reset
        ranges:
          - { from: 0,   to: 249, label: Keine Funktion }
          - { from: 250, to: 255, label: Reset (5 s halten) }
